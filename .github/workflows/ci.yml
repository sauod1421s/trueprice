name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # ملف نقل البيانات db/seed يطابق بيانات الموقع الحالية (أي تغيير بلا إعادة توليد يفشل)
      - run: npm run data:seed:check
      # الاختبارات مع حد أدنى للتغطية (يفشل تحته)
      - run: npm run coverage
      - run: npm run build

  db:
    # قواعد القاعدة على PostgreSQL حقيقي (محلي داخل CI، بلا Supabase وبلا أسرار):
    # نفس ملفات الإنتاج بالترتيب، بدور ترحيل غير مدير، ثم اختبارات الصلاحيات والقواعد
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mvp:setup
      - run: npm run mvp:test-db

  audit:
    # فحص ثغرات حزم الإنتاج — يفشل عند وجود ثغرة عالية أو حرجة
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # حزم الإنتاج: يفشل عند أي ثغرة عالية أو حرجة
      - run: npm audit --omit=dev --audit-level=high
      # كل الحزم بما فيها أدوات التطوير: يفشل عند ثغرة عالية أو حرجة
      - run: npm audit --audit-level=high
      # تقرير كامل بكل المستويات (للعرض فقط)
      - run: npm audit || true
